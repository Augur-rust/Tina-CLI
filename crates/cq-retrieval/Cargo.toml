[package]
name = "cq-retrieval"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
usearch-backend = ["dep:serde", "dep:serde_json", "dep:sha2", "dep:usearch"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.150", optional = true }
sha2 = { version = "0.10.9", optional = true }
usearch = { version = "=2.26.0", optional = true, default-features = false }
